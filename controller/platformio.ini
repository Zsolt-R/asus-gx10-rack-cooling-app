; DGX rack fan controller.  Two boards are supported, same pins, same firmware:
;   lolin_s3_mini -- LOLIN S3 Mini (ESP32-S3FH4R2, 4MB flash / 2MB quad PSRAM)  [default]
;   lolin_s3      -- LOLIN S3 (ESP32-S3-WROOM-1, 16MB flash / 8MB octal PSRAM)
; Pick the other one with:  pio run -e lolin_s3 -t upload
[platformio]
default_envs = lolin_s3_mini

; How many GX10s / fans this controller cools: 2 (fan + probe 1 and 2) or 1
; (fan + probe 1 only -- leave pins 2, 12 and 14 unwired). Applies to every
; build below, USB and Wi-Fi alike.
[fans]
fan_count = 2

[env]
platform  = espressif32
framework = arduino

monitor_speed   = 115200
monitor_filters = time, esp32_exception_decoder
upload_speed    = 921600

; LOLIN S3 talks over the ESP32-S3 native USB peripheral, so Serial must be
; routed to USB-CDC or you get no console at all.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D FAN_COUNT=${fans.fan_count}
    -Wall

[env:lolin_s3]
board = lolin_s3

[env:lolin_s3_mini]
board = lolin_s3_mini

; Firmware update over Wi-Fi (the web password is also the OTA password; it is
; read from the environment so it never lands in this file):
;   DGX_OTA_PASS='...' ~/.platformio/penv/bin/pio run -e lolin_s3_mini_ota -t upload
[env:lolin_s3_mini_ota]
extends         = env:lolin_s3_mini
upload_protocol = espota
upload_port     = dgx-fans.local
upload_flags    = --auth=${sysenv.DGX_OTA_PASS}
