<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GX-RACK Cooler</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%232563eb'/><path d='M16 16c0-6 3-9 7-8-1 4-4 7-7 8zm0 0c6 0 9 3 8 7-4-1-7-4-8-7zm0 0c0 6-3 9-7 8 1-4 4-7 7-8zm0 0c-6 0-9-3-8-7 4 1 7 4 8 7z' fill='white'/></svg>">
<style>
:root {
  --bg: #f5f6f8; --card: #ffffff; --fg: #17181b; --mute: #6a6d75; --line: #e1e3e8;
  --f1: #2563eb; --f2: #d97706; --ok: #15803d; --warn: #b45309; --bad: #c2410c;
  --acc: #17181b; --acc-fg: #ffffff; --grid: #eceef2;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111214; --card: #1a1b1e; --fg: #ececef; --mute: #9a9ca4; --line: #2c2e33;
    --f1: #60a5fa; --f2: #fbbf24; --ok: #4ade80; --warn: #fbbf24; --bad: #fb923c;
    --acc: #ececef; --acc-fg: #111214; --grid: #232428;
  }
}
:root[data-theme="dark"] {
  --bg: #111214; --card: #1a1b1e; --fg: #ececef; --mute: #9a9ca4; --line: #2c2e33;
  --f1: #60a5fa; --f2: #fbbf24; --ok: #4ade80; --warn: #fbbf24; --bad: #fb923c;
  --acc: #ececef; --acc-fg: #111214; --grid: #232428;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 980px; margin: 0 auto; padding: 20px 16px 40px; }
header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
h1 { font-size: 22px; margin: 0; letter-spacing: .02em; }
.sub { color: var(--mute); }
.pill { margin-left: auto; font-size: 13px; padding: 3px 10px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--card); color: var(--mute); }
.pill.live { color: var(--ok); } .pill.stale { color: var(--warn); } .pill.down { color: var(--bad); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid.one { grid-template-columns: 1fr; }
@media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.fan h2 { font-size: 14px; margin: 0; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.temp { font-size: 40px; font-weight: 650; font-variant-numeric: tabular-nums; margin: 6px 0 2px; }
.temp.bad { color: var(--bad); }
.nums { display: flex; gap: 18px; color: var(--mute); font-variant-numeric: tabular-nums; }
.nums b { color: var(--fg); font-weight: 600; }
.bar { height: 6px; border-radius: 3px; background: var(--grid); margin: 12px 0 10px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; transition: width .6s; }
.tags { min-height: 22px; display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; }
.tag.bad { color: var(--bad); } .tag.warn { color: var(--warn); } .tag.info { color: var(--f1); }
.row { display: flex; gap: 8px; margin-top: 12px; }
button { flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); color: var(--fg); font: inherit; cursor: pointer; }
button:hover { border-color: var(--mute); }
button.on { background: var(--acc); color: var(--acc-fg); border-color: var(--acc); }
button.off { background: var(--bad); color: #fff; border-color: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
button small { display: block; font-size: 12px; opacity: .7; }
.label { font-size: 13px; color: var(--mute); margin-bottom: 2px; }
#msg { min-height: 1.45em; margin-top: 10px; color: var(--mute); font-size: 14px; }
#msg.bad { color: var(--bad); }
.charts { margin-top: 12px; }
.charts .head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.charts h3 { font-size: 14px; margin: 0; font-weight: 600; }
.legend { display: flex; gap: 14px; color: var(--mute); font-size: 13px; }
.tabs { margin-left: auto; display: flex; gap: 4px; }
.tabs button { flex: none; padding: 4px 10px; font-size: 13px; border-radius: 8px; }
.chart { position: relative; margin-top: 10px; }
.chart svg { width: 100%; height: 180px; display: block; }
.chart .ttl { font-size: 13px; color: var(--mute); }
.tip { position: absolute; top: 18px; pointer-events: none; font-size: 12px; background: var(--card);
  border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; display: none;
  font-variant-numeric: tabular-nums; white-space: nowrap; }
footer { margin-top: 14px; color: var(--mute); font-size: 13px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>GX-RACK Cooler</h1>
    <span class="pill" id="pill">connecting…</span>
  </header>

  <div class="grid" id="grid">
    <section class="card fan" id="fan0"></section>
    <section class="card fan" id="fan1"></section>
  </div>

  <section class="card" style="margin-top:12px">
    <div class="label">Profile</div>
    <div class="row" style="margin-top:4px">
      <button id="p-quiet" onclick="profile('quiet')">Quiet<small>up to 67 %</small></button>
      <button id="p-normal" onclick="profile('normal')">Normal<small>up to 80 %</small></button>
      <button id="p-max" onclick="profile('max')">Max<small>100 %</small></button>
    </div>
    <div id="msg"></div>
  </section>

  <section class="card charts">
    <div class="head">
      <h3>History</h3>
      <div class="legend">
        <span><span class="dot" style="background:var(--f1)"></span> fan / probe 1</span>
        <span id="leg1"><span class="dot" style="background:var(--f2)"></span> fan / probe 2</span>
      </div>
      <div class="tabs" id="tabs">
        <button data-m="60" class="on">1 h</button><button data-m="360">6 h</button>
        <button data-m="1440">24 h</button><button data-m="10080">7 d</button>
      </div>
    </div>
    <div class="chart"><div class="ttl">Probe temperature, °C</div><svg id="c-temp"></svg><div class="tip"></div></div>
    <div class="chart"><div class="ttl">Fan speed, RPM</div><svg id="c-rpm"></svg><div class="tip"></div></div>
  </section>

  <footer id="foot"></footer>
</main>

<script>
const $ = id => document.getElementById(id);
let S = null, minutes = 60, nFans = 2;
try { minutes = +localStorage.getItem('gx-minutes') || 60; } catch (e) {}

function fanCard(i) {
  const n = i + 1;
  $('fan' + i).innerHTML = `
    <h2><span class="dot" style="background:var(--f${n})"></span>Fan ${n} · probe ${n}</h2>
    <div class="temp" id="t${i}">–</div>
    <div class="nums"><span><b id="d${i}">–</b> duty</span><span><b id="r${i}">–</b> RPM</span></div>
    <div class="bar"><i id="b${i}" style="background:var(--f${n})"></i></div>
    <div class="tags" id="g${i}"></div>
    <div class="row">
      <button id="i${i}" onclick="identify(${n})">Identify fan ${n}</button>
      <button id="o${i}" onclick="power(${n})">Turn off fan ${n}</button>
    </div>`;
}
fanCard(0); fanCard(1);

// The controller says how many fans it has (1 or 2); hide fan 2 when it has one.
function setFans(n) {
  if (n === nFans) return;
  nFans = n;
  $('fan1').style.display = n > 1 ? '' : 'none';
  $('leg1').style.display = n > 1 ? '' : 'none';
  $('grid').className = 'grid' + (n > 1 ? '' : ' one');
  loadHistory();
}

function msg(t, bad) { $('msg').textContent = t || ''; $('msg').className = bad ? 'bad' : ''; }

async function poll() {
  try {
    S = await (await fetch('api/status', { cache: 'no-store' })).json();
  } catch (e) { S = null; }
  render();
}

function render() {
  const pill = $('pill');
  if (!S || !S.fans) {
    pill.textContent = 'controller unreachable'; pill.className = 'pill down';
    msg(S && S.error ? 'Last error: ' + S.error : 'GX-RACK is not answering', true);
    return;
  }
  pill.textContent = S.controller_reachable ? 'live' : 'stale · ' + Math.round(S.age_seconds) + ' s old';
  pill.className = 'pill ' + (S.controller_reachable ? 'live' : 'stale');
  setFans(S.fans.length);
  for (const f of S.fans) {
    const i = f.fan - 1;
    $('t' + i).textContent = f.probe_fault ? 'FAULT' : f.probe_temp_c.toFixed(1) + ' °C';
    $('t' + i).className = 'temp' + (f.probe_fault ? ' bad' : '');
    $('d' + i).textContent = f.duty_pct + ' %';
    $('r' + i).textContent = f.rpm;
    $('b' + i).style.width = f.duty_pct + '%';
    const tags = [];
    if (f.turned_off) tags.push('<span class="tag bad">turned off</span>');
    if (f.probe_fault) tags.push('<span class="tag bad">probe fault</span>');
    if (f.overheat_55c) tags.push('<span class="tag warn">over 55 °C</span>');
    if (S.identify.fan === f.fan) tags.push(`<span class="tag info">identifying · ${S.identify.seconds_left} s</span>`);
    if (!f.duty_pct && !f.turned_off) tags.push('<span class="tag" style="color:var(--mute)">stopped</span>');
    $('g' + i).innerHTML = tags.join('');
    const idOn = S.identify.fan === f.fan;
    $('i' + i).className = idOn ? 'on' : '';
    $('i' + i).textContent = idOn ? `Stop · ${S.identify.seconds_left} s` : `Identify fan ${f.fan}`;
    $('o' + i).className = f.turned_off ? 'off' : '';
    $('o' + i).textContent = (f.turned_off ? 'Turn on fan ' : 'Turn off fan ') + f.fan;
  }
  for (const p of ['normal', 'quiet', 'max']) $('p-' + p).className = S.profile === p ? 'on' : '';
  const notes = [];
  if (!S.switch_on) notes.push('Switch is OFF — fans stay stopped (except above 55 °C).');
  if (S.console_hold) notes.push('USB console hold active.');
  const off = S.fans.filter(f => f.turned_off).map(f => f.fan);
  if (off.length) notes.push((off.length === 2 ? 'Both fans' : 'Fan ' + off[0]) + ' turned off — stays stopped even if hot.');
  if (S.identify.fan) notes.push(`Identifying fan ${S.identify.fan}: 100 %${nFans > 1 ? ', the other stopped' : ''}. Back to normal in ${S.identify.seconds_left} s.`);
  if (!$('msg').dataset.keep) msg(notes.join(' '), !S.switch_on || off.length > 0);
  const up = S.controller_uptime_s;
  $('foot').textContent = `GX-RACK ${S.gx_rack_version} · firmware ${S.firmware_version || 'before 1.1.0'} · controller up ${Math.floor(up / 3600)} h ${Math.floor(up % 3600 / 60)} min · Wi-Fi ${S.wifi_rssi_dbm} dBm · updated ${Math.round(S.age_seconds)} s ago`;
}

async function post(path, body) {
  const r = await fetch(path, { method: 'POST', body: new URLSearchParams(body) });
  if (r.status === 401) { flash('Log in with the fan controller\'s user name and password', true); return; }
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.ok) flash(j.message || 'Error ' + r.status, true);
  if (j.status) { S = j.status; render(); }
}
function flash(t, bad) {
  msg(t, bad); $('msg').dataset.keep = 1;
  setTimeout(() => { delete $('msg').dataset.keep; render(); }, 4000);
}
function profile(p) { post('api/profile', { name: p }); }
function identify(n) { post('api/identify', { fan: S && S.identify.fan === n ? 0 : n }); }
function power(n) {
  const f = S && S.fans[n - 1];
  if (f && !f.turned_off && f.probe_temp_c > 45 &&
      !confirm(`Probe ${n} reads ${f.probe_temp_c.toFixed(1)} °C. Turn fan ${n} off anyway? It stays off even if it gets hotter.`)) return;
  post('api/fan', { fan: n, on: f && f.turned_off ? 1 : 0 });
}

// ------------------------------------------------------------------ charts --
function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function chart(svg, pts, key, fmt) {
  const W = svg.clientWidth || 600, H = 180, L = 44, R = 8, T = 8, B = 22;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  if (!pts.length) { svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" text-anchor="middle" fill="${css('--mute')}" font-size="13">no data yet</text>`; return; }
  const vals = pts.flatMap(p => p[key]).filter(v => v != null);
  let lo = key === 'rpm' ? 0 : Math.min(...vals) - 0.5, hi = Math.max(...vals) + (key === 'rpm' ? 50 : 0.5);
  const raw = (hi - lo) / 4, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const steps = Math.round((hi - lo) / step);
  const t0 = pts[0].ts, t1 = Math.max(pts[pts.length - 1].ts, t0 + 1);
  const x = t => L + (t - t0) / (t1 - t0) * (W - L - R);
  const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  let g = '';
  for (let k = 0; k <= steps; k++) {
    const v = lo + (hi - lo) * k / steps, yy = y(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="${css('--grid')}"/>`;
    g += `<text x="${L - 6}" y="${yy + 4}" text-anchor="end" font-size="11" fill="${css('--mute')}">${fmt(v)}</text>`;
  }
  const nx = W < 500 ? 2 : 4;
  for (let k = 0; k <= nx; k++) {
    const t = t0 + (t1 - t0) * k / nx, d = new Date(t * 1000);
    const lbl = (t1 - t0) > 86400 * 1.5 ? d.toLocaleDateString([], { weekday: 'short', hour: '2-digit' })
                                         : d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    g += `<text x="${x(t)}" y="${H - 5}" text-anchor="${k === 0 ? 'start' : k === nx ? 'end' : 'middle'}" font-size="11" fill="${css('--mute')}">${lbl}</text>`;
  }
  for (let i = 0; i < nFans; i++) {
    let d = '', pen = false;
    for (const p of pts) {
      const v = p[key][i];
      if (v == null) { pen = false; continue; }
      d += (pen ? 'L' : 'M') + x(p.ts).toFixed(1) + ',' + y(v).toFixed(1);
      pen = true;
    }
    g += `<path d="${d}" fill="none" stroke="${css(i ? '--f2' : '--f1')}" stroke-width="2" stroke-linejoin="round"/>`;
  }
  g += `<line class="cur" y1="${T}" y2="${H - B}" stroke="${css('--mute')}" stroke-dasharray="3 3" visibility="hidden"/>`;
  svg.innerHTML = g;
  const tip = svg.parentElement.querySelector('.tip'), cur = svg.querySelector('.cur');
  svg.onmousemove = e => {
    const r = svg.getBoundingClientRect(), mx = (e.clientX - r.left) * W / r.width;
    const t = t0 + (mx - L) / (W - L - R) * (t1 - t0);
    let best = pts[0];
    for (const p of pts) if (Math.abs(p.ts - t) < Math.abs(best.ts - t)) best = p;
    const xx = x(best.ts);
    cur.setAttribute('x1', xx); cur.setAttribute('x2', xx); cur.setAttribute('visibility', 'visible');
    const when = new Date(best.ts * 1000).toLocaleString([], { weekday: 'short', hour: '2-digit', minute: '2-digit' });
    tip.innerHTML = `${when} · <span style="color:var(--f1)">${fmt(best[key][0])}</span>` +
      (nFans > 1 ? ` · <span style="color:var(--f2)">${fmt(best[key][1])}</span>` : '');
    tip.style.display = 'block';
    tip.style.left = Math.min(Math.max(0, xx * r.width / W - tip.offsetWidth / 2), r.width - tip.offsetWidth) + 'px';
  };
  svg.onmouseleave = () => { tip.style.display = 'none'; cur.setAttribute('visibility', 'hidden'); };
}

async function loadHistory() {
  try {
    const h = await (await fetch('api/history?minutes=' + minutes + '&points=300', { cache: 'no-store' })).json();
    chart($('c-temp'), h.points, 'temp', v => v == null ? '–' : (+v).toFixed(1));
    chart($('c-rpm'), h.points, 'rpm', v => v == null ? '–' : Math.round(v));
  } catch (e) {}
}

for (const b of document.querySelectorAll('#tabs button')) {
  b.className = +b.dataset.m === minutes ? 'on' : '';
  b.onclick = () => {
    minutes = +b.dataset.m;
    try { localStorage.setItem('gx-minutes', minutes); } catch (e) {}
    for (const o of document.querySelectorAll('#tabs button')) o.className = o === b ? 'on' : '';
    loadHistory();
  };
}
window.addEventListener('resize', loadHistory);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', loadHistory);

poll(); loadHistory();
setInterval(poll, 2000);
setInterval(loadHistory, 30000);
</script>
</body>
</html>
